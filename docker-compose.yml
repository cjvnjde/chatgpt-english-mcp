services:
  english-learning-mcp:
    image: english-learning-mcp:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TUNNEL_CLIENT_VERSION: ${TUNNEL_CLIENT_VERSION:-v0.0.13}
    restart: unless-stopped
    environment:
      SQLITE_PATH: /app/data/english-mcp.sqlite
      MCP_OWNER_KEY: ${MCP_OWNER_KEY:-default}
      MCP_TUNNEL_LISTEN_ADDRESS: 0.0.0.0:8080
      MCP_EXTERNAL_LISTEN_ADDRESS: 0.0.0.0:8081
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?set MCP_BEARER_TOKEN}
      CAMBRIDGE_TIMEOUT_SECONDS: ${CAMBRIDGE_TIMEOUT_SECONDS:-20}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    expose:
      - "8080"
      - "8081"
    volumes:
      - english-learning-data:/app/data

  openai-tunnel:
    image: english-learning-mcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    entrypoint:
      - /usr/local/bin/tunnel-client
      - run
    depends_on:
      - english-learning-mcp
    environment:
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY:?set CONTROL_PLANE_API_KEY}
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID:?set CONTROL_PLANE_TUNNEL_ID}
      MCP_SERVER_URL: http://english-learning-mcp:8080/mcp
      MCP_STARTUP_WAIT_TIMEOUT: 30s
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}

volumes:
  english-learning-data:

services:
  english-learning-mcp:
    image: english-learning-mcp:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SQLITE_PATH: /app/data/english-mcp.sqlite
      MCP_OWNER_KEY: ${MCP_OWNER_KEY:-default}
      MCP_EXTERNAL_LISTEN_ADDRESS: 0.0.0.0:8081
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?set MCP_BEARER_TOKEN}
      ADMIN_BEARER_TOKEN: ${ADMIN_BEARER_TOKEN:-}
      ANKI_SYNC_ENABLED: "true"
      ANKI_EXPORT_LISTEN_ADDRESS: 0.0.0.0:8082
      ANKI_EXPORT_TOKEN: ${ANKI_EXPORT_TOKEN:?set ANKI_EXPORT_TOKEN}
      ANKI_SOURCE_NAMESPACE: ${ANKI_SOURCE_NAMESPACE:-english-mcp}
      CAMBRIDGE_TIMEOUT_SECONDS: ${CAMBRIDGE_TIMEOUT_SECONDS:-20}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    expose:
      - "8081"
    volumes:
      - english-learning-data:/app/data
    networks:
      - english-network

  english-admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - english-learning-mcp
    environment:
      MCP_UPSTREAM: http://english-learning-mcp:8081
    expose:
      - "80"
    networks:
      - english-network

  anki-worker:
    image: english-mcp-anki:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: anki_worker/Dockerfile
    restart: unless-stopped
    depends_on:
      - english-learning-mcp
    environment:
      ANKI_SYNC_ENABLED: "true"
      ANKI_SOURCE_URL: http://english-learning-mcp:8082/internal/anki/snapshot
      ANKI_EXPORT_TOKEN: ${ANKI_EXPORT_TOKEN:?set ANKI_EXPORT_TOKEN}
      ANKIWEB_USERNAME: ${ANKIWEB_USERNAME:?set ANKIWEB_USERNAME}
      ANKIWEB_PASSWORD: ${ANKIWEB_PASSWORD:?set ANKIWEB_PASSWORD}
      ANKI_SOURCE_NAMESPACE: ${ANKI_SOURCE_NAMESPACE:-english-mcp}
      MCP_OWNER_KEY: ${MCP_OWNER_KEY:-default}
      ANKI_DECK: ${ANKI_DECK:-English MCP}
      ANKI_COLLECTION_PATH: /data/collection.anki2
      ANKI_POLL_SECONDS: ${ANKI_POLL_SECONDS:-60}
    volumes:
      - anki-worker-data:/data
    networks:
      - english-network
    healthcheck:
      test: ["CMD", "python", "-m", "anki_worker", "status"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3

volumes:
  english-learning-data:
  anki-worker-data:

networks:
  english-network:

name: Sign Firefox extension

on:
  push:
    branches: [main]
    paths:
      - 'firefox-extension/**'

permissions:
  contents: read

concurrency:
  group: firefox-extension-signing
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: firefox-extension/package-lock.json
      - name: Check whether the manifest version is new to AMO
        id: version
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/check-firefox-release.mjs
      - name: Install locked extension tooling
        if: steps.version.outputs.sign == 'true'
        working-directory: firefox-extension
        run: npm ci
      - name: Test extension
        if: steps.version.outputs.sign == 'true'
        working-directory: firefox-extension
        run: npm test
      - name: Validate extension
        if: steps.version.outputs.sign == 'true'
        working-directory: firefox-extension
        run: npm run lint
      - name: Sign for unlisted distribution
        if: steps.version.outputs.sign == 'true'
        working-directory: firefox-extension
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: >-
          npx --no-install web-ext sign
          --source-dir .
          --artifacts-dir dist
          --channel unlisted
          --timeout 300000
          --approval-timeout 900000
          --no-input
          --ignore-files package.json package-lock.json tests 'tests/**' dist 'dist/**'
      - name: Upload signed XPI
        if: steps.version.outputs.sign == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: english-dictionary-${{ steps.version.outputs.version }}-signed
          path: firefox-extension/dist/*.xpi
          if-no-files-found: error
          retention-days: 90

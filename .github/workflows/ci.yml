name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - name: Install locked modules
        run: go mod download
      - name: Test with race detection
        run: go test -race ./...
      - name: Build production server
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/english-learning-mcp" ./cmd/english-learning-mcp

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: |
            anki_worker/requirements.txt
            .github/requirements-builders.txt
      - name: Install hashed worker and builder dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r anki_worker/requirements.txt -r .github/requirements-builders.txt
      - name: Test Anki worker
        run: python -m unittest discover -s anki_worker -t .
      - name: Test dictionary builders
        run: python -m unittest discover -s scripts -p 'test_*.py'

  admin:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install locked packages
        run: npm ci
      - name: Test admin
        run: npm test
      - name: Build production admin
        run: npm run build
